# Roadmap_Scaling.md A7 — the load-balanced front door for the local multi-instance
# proof. Mirrors the target architecture's split (§2.3): API traffic and WebSocket
# traffic go to different upstreams because they scale on different signals, and the
# realtime upstream is sticky so a reconnecting client keeps landing on the same pod
# (matters for the cross-pod delivery proof — the WS client always connects fresh, but a
# real client reconnecting after a drop should too).

events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        least_conn;
        server api-1:8000;
        server api-2:8000;
        server api-3:8000;
    }

    upstream realtime_backend {
        # Sticky by client IP — a reconnecting client should land back on the same
        # realtime pod deliberately, not be redistributed mid-session.
        ip_hash;
        server realtime-1:8000;
        server realtime-2:8000;
    }

    server {
        listen 80;

        # The app's one WebSocket path (messaging.md: "the WebSocket stayed at
        # /meme-sending/ws — it's the app's single per-user socket, not a
        # meme-sending-feature endpoint"). The roadmap's IMPLEMENT step says "route /ws
        # to the realtime upstream" as shorthand for this actual path.
        location /meme-sending/ws {
            proxy_pass http://realtime_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
