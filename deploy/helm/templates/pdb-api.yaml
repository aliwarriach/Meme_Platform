# Roadmap_Scaling.md C4 step 5 — so Karpenter consolidation and spot reclaim can
# never take down every api replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    {{- include "meme-platform.labels" . | nindent 4 }}
    app: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
