; Roadmap_Scaling.md A7 — transaction-pooling mode, the mode that requires A2's
; statement_cache_size=0 asyncpg workaround (app/db/session.py, gated on
; DB_USE_PGBOUNCER=true). This is the real production path (C3 runs PgBouncer the same
; way) being exercised locally/in-CI, not a simplified stand-in.
;
; auth_type=plain + userlist.txt, not trust: `trust` with no auth_file configured is
; ambiguous across PgBouncer versions — some still require a resolvable user record even
; in trust mode, which is what actually broke this in CI ("trust authentication failed"
; on every incoming connection, since no user was ever defined anywhere). Plaintext
; credentials are fine here only because this stack is ephemeral, local/CI-only, and
; carries no real secrets — never the pattern for a real deployment (C3's PgBouncer will
; need real auth once it's fronting the actual RDS instance).
;
; The [databases] line also pins explicit backend credentials rather than relying on
; PgBouncer's client-credential pass-through, so the backend connection is deterministic
; regardless of exactly how client-side auth resolves.

[databases]
meme_platform = host=postgres port=5432 dbname=meme_platform user=postgres password=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

pool_mode = transaction
max_client_conn = 200
; Sizing math from A2 (app/core/config.py): pods x (db_pool_size + db_max_overflow) must
; stay <= max_client_conn above, and default_pool_size here must stay <= Postgres's own
; max_connections minus headroom. 6 app containers x (5+5) = 60 <= 200; 20 <= Postgres's
; default 100 with plenty of headroom.
default_pool_size = 20

logfile = /dev/stdout
pidfile = /tmp/pgbouncer.pid
